services:
  - type: web
    name: meribaari-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    # Run single-worker to ensure in-memory WebSocket ConnectionManager broadcast consistency
    startCommand: gunicorn server:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --forwarded-allow-ips='*'
    rootDir: backend
    envVars:
      - key: MONGO_URL
        sync: false          # Set in Render dashboard — never commit credentials
      - key: DB_NAME
        value: clinicqueue
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard
      - key: DPDP_STRIP_DEV_OTP
        value: "1"           # Hide dev OTP in production
      - key: EMERGENT_PUSH_KEY
        sync: false          # Set in Render dashboard if push is enabled
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # Set in Render dashboard as secret — never commit credentials
      - key: APP_PUBLIC_URL
        value: https://www.meribaariapp.in
      - key: QUEUE_ETA_CHANGE_THRESHOLD_MINUTES
        value: "10"
      - key: SMS_PROVIDER
        value: "aisensy"
      - key: AISENSY_BASE_URL
        value: "https://backend.aisensy.com/campaign/t1/api/v2"
      - key: AISENSY_OTP_CAMPAIGN_NAME
        value: "Meribaari_otp_api"
      - key: AISENSY_APPT_CAMPAIGN_NAME
        value: "Meribaari_appointment_api"
      - key: AISENSY_API_KEY
        sync: false
    healthCheckPath: /health
